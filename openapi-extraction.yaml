openapi: 3.0.3

info:
  title: PE Subscription Platform — Extraction Service API
  description: |
    REST API for `pe-sub-extraction` (Spring Boot 3.5 / Java 21), the document
    extraction service of the PE Subscription Borrowing Base platform.

    **Role**
    Parses uploaded agent borrowing-base schedules (XLSX / XLS / CSV), detects the bank
    template and header row, maps columns to canonical LP fields via the alias dictionary,
    and returns structured LP records with per-field confidence scores.

    **How it is called**
    `pe-sub-api` (port 3001) calls `POST /api/extract` with `forward=false` on every upload
    and re-extraction, receives the `ExtractionResult` directly, and persists it. The UI never
    calls this service directly. When `forward=true`, the service instead POSTs the result to
    `pe-sub-api`'s `/api/lps/ingest` endpoint (standalone testing only).

    Core API spec for `pe-sub-api`: `pe-sub-docs/openapi.yaml`.
  version: 0.1.0
  contact:
    name: PE Sub Platform Team

servers:
  - url: http://localhost:3002
    description: Development (internal service; ClusterIP-only in Kubernetes)

tags:
  - name: health
    description: Service health check
  - name: extraction
    description: Agent schedule parsing and LP record extraction

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: extractionHealthCheck
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /api/inspect:
    post:
      tags: [extraction]
      summary: Inspect workbook structure for template recognition
      description: >
        Returns raw workbook signals (sheet names and the first N rows per sheet) so
        `pe-sub-api` can recognise the workbook against the `bb_templates` registry before
        requesting deterministic extraction. This endpoint does not extract LP records.
      operationId: inspectWorkbook
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX, XLS, or CSV agent schedule
                rows:
                  type: integer
                  default: 15
                  description: Number of leading rows to return per sheet
      responses:
        '200':
          description: Workbook structural signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbookSignals'
        '400':
          description: Malformed request
        '500':
          description: Inspection failure

  /api/extract:
    post:
      tags: [extraction]
      summary: Parse an agent schedule and extract LP records
      description: >
        Accepts a multipart upload of an agent borrowing-base schedule. The pipeline runs:
        Parser → TemplateDetector → HeaderMatcher → LpRecordExtractor. Null markers
        (`N/A`, `N/R`, `NA`, `NR`) are treated as missing; summary rows (`Total`, `Grand Total`,
        `Subtotal`, …) are filtered. `sheetNameHint` / `headerRowHint` override heuristic detection
        when provided; `aliasConfig` (the live FM Dictionary from `pe-sub-api`) overrides built-in
        aliases. A row's `requiresReview` is set `true` when any field is missing or a header's
        confidence is below 0.70.
      operationId: extract
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [facilityId, file]
              properties:
                facilityId:
                  type: string
                  description: Target facility ID (used when forwarding to pe-sub-api)
                file:
                  type: string
                  format: binary
                  description: XLSX, XLS, or CSV agent schedule (max 50 MB)
                forward:
                  type: boolean
                  default: true
                  description: >
                    When true, POST the result to `pe-sub-api/api/lps/ingest`. `pe-sub-api`
                    always passes `false` and persists the returned result itself.
                aliasConfig:
                  type: string
                  description: >
                    JSON alias map built from the live FM Dictionary; takes precedence over the
                    built-in alias list when provided.
                sheetNameHint:
                  type: string
                  description: Preferred sheet name; bypasses the sheet heuristic when provided.
                headerRowHint:
                  type: integer
                  description: Known zero-based header row index; bypasses header detection when provided.
                headerRowSpan:
                  type: integer
                  description: Number of physical rows occupied by a stacked column header.
                classificationConfig:
                  type: string
                  description: >
                    JSON `{ "header text": "Agent LP Classification" }` map for templates that group
                    LPs into classification section rows; merged on top of the standard classification
                    values, which are always recognised.
                agentBank:
                  type: string
                  description: Agent bank name supplied by pe-sub-api for bank-specific parsing/mapping.
                forceTemplate:
                  type: string
                  description: Optional template override name used by manual re-extraction/testing.
                sheetNames:
                  type: array
                  items: { type: string }
                  description: Repeated multipart field naming the exact LP-grid sheets to parse for multi-tab templates.
                autoDiscoverTabs:
                  type: boolean
                  default: false
                  description: When true, scan all workbook sheets for LP-grid tabs instead of using explicit sheet names.
                skipRowKeywords:
                  type: array
                  items: { type: string }
                  description: Repeated multipart field of first-cell keywords whose rows should be dropped before LP parsing.
      responses:
        '200':
          description: Structured extraction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResult'
        '400':
          description: Malformed request (e.g. missing file or facilityId)
        '500':
          description: Parsing failure (corrupt or unsupported file)

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:
  schemas:

    WorkbookSignals:
      type: object
      description: Raw workbook preview used by pe-sub-api template recognition.
      properties:
        fileName:
          type: string
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/SheetSignals'

    SheetSignals:
      type: object
      properties:
        name:
          type: string
          description: Workbook sheet name
        rows:
          type: array
          description: Leading rows from the sheet; each row is an array of cell text.
          items:
            type: array
            items: { type: string }

    ExtractionResult:
      type: object
      description: Top-level extraction payload returned to pe-sub-api.
      properties:
        template:
          $ref: '#/components/schemas/TemplateDetection'
        records:
          type: array
          items: { $ref: '#/components/schemas/ExtractedLpRecord' }
        totalFlagged:
          type: integer
          description: Count of records with `requiresReview = true`
        fieldMappings:
          type: array
          items: { $ref: '#/components/schemas/FieldMapping' }
          description: Recognised columns mapped to canonical fields
        unrecognizedColumns:
          type: array
          items: { type: string }
          description: >
            Header texts whose best Jaro-Winkler score against the alias dictionary fell below the
            0.95 recognition threshold (`HeaderMatcher.MIN_CONFIDENCE`). Surfaced for manual remap
            in the UI — never silently dropped.

    TemplateDetection:
      type: object
      properties:
        format:
          $ref: '#/components/schemas/TemplateFormat'
        version:
          type: string
          nullable: true
          description: Reserved for future template versioning
        headerRowIndex:
          type: integer
          description: Zero-based index of the detected header row
        sheetName:
          type: string
          nullable: true
          description: Name of the sheet the data was extracted from

    ExtractedLpRecord:
      type: object
      properties:
        rowIndex:
          type: integer
          description: Zero-based source row index in the sheet
        fields:
          type: object
          description: >
            Canonical field key → extracted value with confidence. Common keys: `INVESTOR_NAME`,
            `COMMITMENT`, `UNCALLED`, `AUM`, `AGENT_RATE`, `CONCENTRATION_LIMIT`,
            `AGENT_LP_CLASSIFICATION`, plus rating/identity keys present in the template.
          additionalProperties:
            $ref: '#/components/schemas/FieldExtraction'
        requiresReview:
          type: boolean
          description: True when any field is missing or a header confidence is below 0.70
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ExtractionWarning' }

    FieldExtraction:
      type: object
      description: One extracted cell value with provenance and confidence.
      properties:
        value:
          type: string
          nullable: true
          description: Extracted value; null for null markers / missing cells
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Header-match confidence from Jaro-Winkler similarity between the source column header
            and the matched alias: an exact alias match scores 1.0. A column is only recognised
            when its best score is ≥ 0.95 (`HeaderMatcher.MIN_CONFIDENCE`); otherwise the header is
            returned in `unrecognizedColumns`. A present value whose confidence is below 0.70
            (`FieldExtraction.LOW_CONFIDENCE_THRESHOLD`) is flagged low-confidence and sets the
            row's `requiresReview`.
        sourceHeader:
          type: string
          nullable: true
          description: The original column header this value was read from

    FieldMapping:
      type: object
      properties:
        extractedHeader:
          type: string
          description: Column header text from the document
        canonicalField:
          type: string
          description: Canonical field key the header resolved to
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1

    ExtractionWarning:
      type: object
      properties:
        field:
          type: string
          description: Canonical field key the warning concerns
        message:
          type: string
          description: Human-readable explanation (e.g. "value missing")
        rowIndex:
          type: integer
          description: Source row the warning applies to

    TemplateFormat:
      type: string
      description: >
        Detected bank template format (mirrors `TemplateFormat.java`). `UNKNOWN` when no format
        matches. The first group is the active UBS PE sub-line agent-bank portfolio; the second is
        legacy / inactive (retained for historical submissions — `GOLDMAN_SACHS` is the prior agent
        for Blue Owl GP Stakes V, now agented by Wells Fargo); the last two are utility values.
      enum:
        # ── Active agent banks ──────────────────────────────
        - BANK_OF_AMERICA
        - BMO
        - BNY_MELLON
        - CIBC
        - CITY_NATIONAL
        - CITIBANK
        - JPM
        - LLOYDS
        - MIZUHO
        - MORGAN_STANLEY
        - MT_BANK
        - NATIXIS
        - PNC_BANK
        - SILICON_VALLEY_BANK
        - SMBC
        - SOCIETE_GENERALE
        - UBS_BANK_USA
        - WELLS_FARGO
        # ── Legacy / inactive ───────────────────────────────
        - GOLDMAN_SACHS
        - BARCLAYS
        - FIFTH_THIRD
        - HUNTINGTON
        - WHITE_OAK
        - ARES
        - MIDCAP_FINANCIAL
        - CITIZENS_FINANCIAL
        # ── Utility ─────────────────────────────────────────
        - INTERNAL
        - UNKNOWN
