openapi: 3.0.3

info:
  title: PE Subscription Platform API
  description: |
    REST API for the PE Subscription Borrowing Base platform.

    **Services**
    | Service | Port | Role |
    |---|---|---|
    | `pe-sub-api` | 3001 | Core REST API — LPs, facilities, BB calculation, submissions, audit |
    | `pe-sub-extraction` | 3002 | Document extraction — parses XLSX/CSV agent schedules, posts to `/lpRecords/ingest` |
    | `pe-sub-jobs` | 3003 | Spring Batch 6 ingestion jobs — DB-less; parses feed CSVs and posts them to this API's SERVICE-gated ingest/seed endpoints |

    This spec covers `pe-sub-api` (Spring Boot 4.1 / Java 25). The extraction service
    (`pe-sub-extraction`, port 3002) is documented separately in `pe-sub-docs/openapi-extraction.yaml`.

    **Route status legend**
    - Routes with no tag note are **implemented** in `pe-sub-api`.
    - Routes marked `[planned]` are not yet implemented; the UI falls back to
      static mock data when they return non-2xx.

    **Authentication** — stateless, header-based. In `gateway` mode (production, behind UBS SSO)
    every request must carry `X-Auth-User` and `X-Auth-Roles`; a missing user header returns `401`.
    In `dev` mode (default local) a fixed dev identity is injected so no headers are required.
    Roles: `ANALYST`, `ATM`, `SERVICE`. Service-to-service endpoints require `SERVICE`
    (`POST /lpRecords/ingest`, `POST /lpRecords/seed`, `POST /facilities/ingest`,
    `POST /lp-master/ingest`, `PATCH /config/cls-conc-limit-defaults`); configuration and
    field-mapping mutations require `ANALYST` — an insufficient role returns `403`. Public routes
    (`/ping`, `/health`, `/notifications/**`) need no identity.
  version: 0.9.0
  contact:
    name: PE Sub Platform Team

servers:
  - url: http://localhost:3001/api
    description: Development (Vite proxy forwards /api → localhost:3001)

# Applies in gateway mode. In dev mode the dev identity is injected and these headers are optional.
security:
  - GatewayUser: []
    GatewayRoles: []

tags:
  - name: facilities
    description: Facility-level records and status management
  - name: lp-master
    description: Bank-wide LP Master store — the standardized upstream LP reference shared across facilities
  - name: lpRecords
    description: Per-facility LP records — computed eligibility, classification, rate, and BB per facility
  - name: borrowing-base
    description: Shadow BB calculation engine, snapshot history, and summary extensions
  - name: reports
    description: Portfolio-level reporting outputs (collateral, concentration, EAR)
  - name: submissions
    description: Agent BB document upload and submission lifecycle
  - name: extraction
    description: >
      Document extraction results persisted in `submission_extractions` by `pe-sub-api`
      and served via submission sub-endpoints. `pe-sub-extraction` (port 3002) is called
      internally by `pe-sub-api` on upload and re-extraction; the UI never calls it directly.
  - name: field-mapping
    description: Alias-group dictionary mapping extracted headers to canonical LP fields
  - name: matching
    description: LP name-matching queue and decision workflow
  - name: audit
    description: Audit trail — append-only event log written by BbController, LpController, SubmissionController, and the login hook
  - name: config
    description: Platform configuration — advance rates, eligibility rules, matching thresholds
  - name: notifications
    description: Server-Sent Events stream for real-time broadcast of facility and LP events

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /health:
    servers:
      - url: http://localhost:3001
        description: Served at the host root, outside the /api base path
    get:
      summary: Health check (host root, not under /api)
      operationId: healthCheck
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ping:
    get:
      summary: Liveness check under the /api base
      description: Same status payload as `/health`, but served under the `/api` prefix.
      operationId: ping
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Facilities ───────────────────────────────────────────────────────────────

  /facilities:
    get:
      tags: [facilities]
      summary: List all facilities
      operationId: listFacilities
      responses:
        '200':
          description: Array of facility records ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facility'
    post:
      tags: [facilities]
      summary: Create a new facility
      operationId: createFacility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, agentBank]
              properties:
                name:      { type: string }
                agentBank: { type: string }
      responses:
        '201':
          description: Created facility record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '409':
          description: Facility name already exists

  /facilities/ingest:
    post:
      tags: [facilities, jobs]
      summary: Bulk upsert facilities from the pe-sub-jobs feed (SERVICE role)
      description: >
        Called by `pe-sub-jobs` with the Agent Bank Summary CSV rows, upserted by facility
        `name`. New facilities get the platform defaults (status "Not Started", $25M conc
        limit); existing ones have their agent-reported fields overwritten in place —
        including with nulls (feed replace semantics) — while platform-owned fields
        (status, concLimitM, facilitySize, lastRunAt) are never touched. Rows without a
        name or agent bank are counted as skipped.
      operationId: ingestFacilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:             { type: string }
                  agentBank:        { type: string }
                  accountNumber:    { type: string, nullable: true }
                  loanAmount:       { type: number, nullable: true }
                  maturityDate:     { type: string, format: date, nullable: true }
                  bankStatus:       { type: string, nullable: true }
                  bankStatusDate:   { type: string, format: date, nullable: true }
                  ubsParticipation: { type: number, nullable: true }
                  collateralDate:   { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Ingest summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }

  /facilities/{id}:
    get:
      tags: [facilities]
      summary: Get a single facility
      operationId: getFacility
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Facility record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [facilities]
      summary: Update facility fields
      description: >-
        Partial update of the editable facility fields (Identity + Agent Bank Summary) entered on
        the Facility Edit screen. Every field is optional; only the fields present in the body are
        applied. `name` and `agentBank` are blank-guarded — a blank value is ignored rather than
        clearing the NOT NULL column. Renaming to a name already used by another facility returns 409.
      operationId: updateFacility
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Facility (borrower) name — must be unique across facilities
                agentBank:
                  type: string
                  description: Agent bank administering the facility
                accountNumber:
                  type: string
                  nullable: true
                  description: UBS internal identifier (e.g. "5VX1796")
                loanAmount:
                  type: number
                  nullable: true
                  description: Committed facility size in dollars
                maturityDate:
                  type: string
                  format: date
                  nullable: true
                  description: Facility maturity date from the credit agreement
                collateralDate:
                  type: string
                  format: date
                  nullable: true
                  description: Collateral as-of date from the Agent Bank Summary
                facilitySize:
                  type: number
                  nullable: true
                  description: Stated facility commitment in dollars (Shadow BB Borrowing Base input)
                ubsParticipation:
                  type: number
                  nullable: true
                  description: UBS's participation share of the facility in dollars (Shadow BB Borrowing Base input)
      responses:
        '200':
          description: Updated facility record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [facilities]
      summary: Delete a facility
      description: >-
        Permanently delete a facility. Permitted only while it holds no LP records — committed LP
        data is never destroyed. Cascades to the facility's non-LP dependents (submissions and their
        extractions, match-queue entries, Shadow BB snapshots); audit_log rows are preserved with
        their facility reference nulled.
      operationId: deleteFacility
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Facility deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /facilities/{id}/status:
    patch:
      tags: [facilities]
      summary: Update facility status
      description: >-
        Update the workflow status. Transitioning to `Inactive` (deactivation) is permitted only
        while the facility holds no LP records; otherwise 409 is returned. Reactivation (any other
        status) is unconditional.
      operationId: updateFacilityStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/FacilityStatus'
      responses:
        '200':
          description: Updated facility record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ── LP Master ────────────────────────────────────────────────────────────────

  /lp-master:
    get:
      tags: [lp-master]
      summary: List all LP Master records
      description: Bank-wide LP Master store, ordered by UBS classification then investor name.
      operationId: listLpMaster
      responses:
        '200':
          description: LP Master records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LpMaster'

  /lp-master/ingest:
    post:
      tags: [lp-master, jobs]
      summary: Bulk upsert LP Master profiles from the pe-sub-jobs feed (SERVICE role)
      description: >
        Called by `pe-sub-jobs` with the analyst-compiled LP Master CSV rows, upserted by
        `investorName`. The feed is the authoritative source for the whole profile —
        identity, classification, ratings, financial scale, and the UBS credit-profile
        defaults — so every field is overwritten (including with nulls) on update. Rows
        without an investor name are counted as skipped.
      operationId: ingestLpMaster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  investorName:        { type: string }
                  parent:              { type: string, nullable: true }
                  spv:                 { type: boolean }
                  highQty:             { type: boolean }
                  investorType:        { type: string, nullable: true }
                  instVsHnw:           { type: string, nullable: true }
                  regionLocation:      { type: string, nullable: true }
                  investmentGrade:     { type: boolean }
                  sp:                  { type: string }
                  mdy:                 { type: string }
                  fitch:               { type: string }
                  aum:                 { type: string, nullable: true }
                  nav:                 { type: string, nullable: true }
                  pension:             { type: string, nullable: true }
                  pensionFunded:       { type: string, nullable: true }
                  ubsClassification:   { type: string, nullable: true }
                  ubsDefaultAdvRate:   { type: string, nullable: true }
                  ubsDefaultConcLimit: { type: string, nullable: true }
                  notes:               { type: string, nullable: true }
      responses:
        '200':
          description: Ingest summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }

  /lp-master/count:
    get:
      tags: [lp-master]
      summary: Count of LP Master records
      operationId: countLpMaster
      responses:
        '200':
          description: Record count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /lp-master/investor-types:
    get:
      tags: [lp-master]
      summary: Distinct investor types present in the LP Master
      description: >
        Sorted, de-duplicated list of the non-blank investor-type values across all LP Master
        records. Used to populate the investor-type filter/select in the UI. New in July 2026;
        complements the derived-on-ingest investor-type classification (InvestorTypeDeriver).
      operationId: listLpMasterInvestorTypes
      responses:
        '200':
          description: Distinct investor-type labels
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example: ["Endowment", "Family Office", "Fund of Funds", "Insurance Company", "Pension Fund", "Sovereign Wealth Fund"]

  /lp-master/{id}:
    get:
      tags: [lp-master]
      summary: Get one LP Master record
      operationId: getLpMaster
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: LP Master record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LpMaster'
        '404':
          description: Not found

  # ── LPs ──────────────────────────────────────────────────────────────────────

  /lpRecords:
    get:
      tags: [lpRecords]
      summary: List LP records
      operationId: listLPs
      parameters:
        - name: facilityId
          in: query
          schema:
            type: integer
          description: Filter by facility
        - name: cls
          in: query
          schema:
            $ref: '#/components/schemas/LPClassification'
          description: Filter by classification tier
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring match on investor name
      responses:
        '200':
          description: LP records ordered by investor name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LP'

  /lpRecords/{id}:
    get:
      tags: [lpRecords]
      summary: Get a single LP record
      operationId: getLP
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: LP record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LP'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [lpRecords]
      summary: Update LP fields (classification override, reclassify, notes, etc.)
      operationId: updateLP
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LPPatch'
      responses:
        '200':
          description: Updated LP record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LP'
        '404':
          $ref: '#/components/responses/NotFound'

  /lpRecords/classification:
    patch:
      tags: [lpRecords]
      summary: Batch-save classification & rate edits onto persisted LP records
      description: >
        The "Save" action on the LP Classification & Rate Assignment (Shadow BB) screen.
        LP records are created up front when match decisions are committed, so this writes the
        credit officer's edits onto real LP Master records. Rows are matched to existing records
        by `(facilityId, originalName || name)`; unmatched names are ignored. LP entity fields
        (`name`, `parent`, `spv`, `investorType`, `instVsHnw`, `region`, `agentCls`, `agentClsSource`, `cls`,
        `sp`, `mdy`, `fitch`, `aum`, `nav`, `pension`, `pensionFunded`, `capCommit`, `inc`,
        `uc`, `notes`) update in place when present. `ubsAdvRatePct` / `agentRatePct` /
        `ubsConcLimitPct` / `agentConcLimitPct` are percentages; UBS rate and concentration
        fields upsert into `lp_rates` for the period as decimal fractions. Blank or omitted `cls`
        is preserved as Unclassified; the service no longer defaults it to Eligible.
      operationId: saveLPClassification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facilityId, rows]
              properties:
                facilityId:    { type: integer }
                effectiveDate: { type: string, description: "YYYY-MM; defaults to current month", nullable: true }
                audit:         { type: boolean, description: "true writes one aggregate audit entry; false/null is silent autosave", nullable: true }
                rows:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:            { type: string }
                      originalName:    { type: string, nullable: true, description: "Previous persisted investor name when renaming a row" }
                      parent:          { type: string, nullable: true }
                      spv:             { type: boolean, nullable: true }
                      investorType:    { type: string, nullable: true, description: "Alias: investor_type" }
                      instVsHnw:       { type: string, nullable: true, description: "Aliases: inst_vs_hnw, type" }
                      type:            { type: string, nullable: true, deprecated: true, description: "Accepted alias for instVsHnw" }
                      region:          { type: string, nullable: true, description: "Aliases: region_location, regionLocation" }
                      ig:              { type: boolean, nullable: true, description: "Investment Grade flag" }
                      agentCls:        { type: string, nullable: true, description: "Agent LP Category" }
                      agentClsSource:  { type: string, nullable: true, enum: [EXTRACTED, DERIVED, USER_EDITED], description: "Provenance of agentCls; omitted or invalid values fall back to USER_EDITED when agentCls is present" }
                      cls:             { type: string, nullable: true, description: "UBS LP Category; blank/null represents Unclassified" }
                      sp:              { type: string, nullable: true }
                      mdy:             { type: string, nullable: true }
                      fitch:           { type: string, nullable: true }
                      aum:             { type: string, nullable: true, description: "Assets Under Management" }
                      nav:             { type: string, nullable: true, description: "Net Asset Value" }
                      pension:         { type: string, nullable: true, description: "Pension Assets" }
                      pensionFunded:   { type: string, nullable: true, description: "Pension Funded %" }
                      capCommit:       { type: string, nullable: true, description: "Capital commitment" }
                      inc:             { type: boolean, nullable: true }
                      uc:              { type: string, nullable: true }
                      ubsAdvRatePct:   { type: number, nullable: true, description: "percent, e.g. 90.0" }
                      agentRatePct:    { type: number, nullable: true, description: "percent, e.g. 65.0" }
                      ubsConcLimitPct: { type: number, nullable: true, description: "percent, e.g. 7.5" }
                      agentConcLimitPct: { type: number, nullable: true, description: "percent, e.g. 10.0" }
                      notes:           { type: string, nullable: true }
            example:
              facilityId: 12
              effectiveDate: "2026-06"
              audit: true
              rows:
                - name: CalPERS
                  originalName: CalPERS
                  parent: California Public Employees Retirement System
                  spv: false
                  investorType: Pension Fund
                  instVsHnw: Institutional
                  region: North America
                  agentCls: Rated Included
                  agentClsSource: EXTRACTED
                  cls: Rated Investor
                  sp: AAA
                  inc: true
                  uc: "$20.0M"
                  ubsAdvRatePct: 90.0
                  ubsConcLimitPct: 7.5
      responses:
        '200':
          description: Number of LP records updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /lpRecords/ingest:
    post:
      tags: [lpRecords, extraction]
      summary: Ingest extracted LP records from pe-sub-extraction
      description: >
        Called by `pe-sub-extraction` after parsing an agent schedule file.
        For each extracted LP row the service runs fuzzy name matching against
        the facility's existing LP records (Jaro-Winkler + Levenshtein, configurable
        thresholds) and either updates the LP's financial fields or places the row
        in the review queue.

        **Action values**
        - `Updated` — match score ≥ auto-accept threshold AND all extraction fields
          meet the 70% confidence minimum; LP `aum`, `capCommit`, `uc`,
          `agentRate`, and `agentConc` are written.
        - `Queued` — match score is between review-queue and auto-accept thresholds,
          OR the extraction flagged low-confidence fields; no LP data written.
        - `Skipped` — match score below review-queue threshold, or no investor name
          was extracted.

        Writes an `LP Data Updated` audit event when at least one LP is updated.
      operationId: ingestExtractedLPs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
            example:
              facilityId: 42
              extraction:
                template:
                  format: CITIBANK
                  version: null
                  headerRowIndex: 2
                totalFlagged: 1
                records:
                  - rowIndex: 3
                    investorName:       { value: "Blackstone Capital Partners", confidence: 1.0,  sourceHeader: "Investor Name" }
                    commitment:         { value: 50000000,                       confidence: 0.85, sourceHeader: "Total Commitment" }
                    uncalled:           { value: 30000000,                       confidence: 0.85, sourceHeader: "Unfunded Commitment" }
                    aum:                { value: 120000000000,                   confidence: 1.0,  sourceHeader: "AUM" }
                    agentRate:          { value: 0.65,                           confidence: 1.0,  sourceHeader: "Advance Rate" }
                    concentrationLimit: { value: 0.10,                           confidence: 0.85, sourceHeader: "Conc. Limit" }
                    requiresReview: false
                    warnings: []
      responses:
        '200':
          description: Ingest summary — one result per extracted row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'

  /lpRecords/seed:
    post:
      tags: [lpRecords, jobs]
      summary: Seed facility LP records from the pe-sub-jobs feed (SERVICE role)
      description: >
        Called by `pe-sub-jobs` on startup with the lp_facility_seeds CSV rows. The API
        resolves the facility and LP Master references by name, merges the LP Master profile
        (identity, ratings, financial scale) onto the new record, and normalizes the agent /
        UBS classifications. `lp_records` deliberately has no unique constraint on
        (facility, investor) — the same investor may appear across sleeves — so idempotency is
        application-level: pairs that already have a record are skipped, never overwritten.
        Rows whose facility or LP Master cannot be resolved are skipped.
      operationId: seedLpRecords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  facilityName: { type: string }
                  investorName: { type: string }
                  capCommit:    { type: string, example: "$250M" }
                  uncalled:     { type: string, example: "$75M" }
                  agentCls:     { type: string, example: "Rated Included" }
                  agentRate:    { type: string, example: "90%" }
                  agentConc:    { type: string, example: "5%" }
      responses:
        '200':
          description: Seed summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer, description: Always 0 — existing pairs are skipped, not updated }
                  skipped: { type: integer }

  /lpRecords/rates:
    get:
      tags: [lpRecords]
      summary: LP advance rates and concentration limits as of a given period
      description: >
        Returns the most-recent `lp_rates` row per LP with `effective_date ≤ effective_date`
        parameter. Used by the Run Shadow BB screen to pre-fill UBS Adv Rate and Conc. Limit
        columns without requiring the credit officer to re-enter rates each period.
        Falls back to today's date when the parameter is omitted.
      operationId: getLpRates
      parameters:
        - name: effective_date
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-05' }
          description: Period month (YYYY-MM) — returns rates in effect as of the last day of this month
      responses:
        '200':
          description: List of LP rates (one per LP, most recent as of the requested date)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LpRate'
        '400':
          $ref: '#/components/responses/BadRequest'

  /lpRecords/rates/batch:
    post:
      tags: [lpRecords]
      summary: Upsert a batch of LP advance rates for one period
      description: >
        Bulk-inserts or updates `lp_rates` rows for a single `effectiveDate`. LP lookup is by
        case-insensitive name match against `lps.investor_name`; unmatched names are skipped.
        Idempotent — re-posting the same `effectiveDate` overwrites existing rows for those LPs.
      operationId: batchUpsertLpRates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveDate, rates]
              properties:
                effectiveDate:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  description: Period month (YYYY-MM) the rates take effect
                  example: '2026-05'
                rates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [lpName, classification, ubsAdvRatePct, ubsConcLimitPct]
                    properties:
                      lpName:          { type: string, description: Investor name — case-insensitive match }
                      classification:  { type: string, description: LP classification at time of rate assignment }
                      ubsAdvRatePct:   { type: number, minimum: 0, maximum: 1, description: UBS advance rate as decimal fraction e.g. 0.90 }
                      ubsConcLimitPct: { type: number, minimum: 0, maximum: 1, description: Per-LP concentration limit as decimal fraction e.g. 0.075 }
                      source:          { type: string, nullable: true, description: Origin system or analyst identifier }
            example:
              effectiveDate: '2026-05'
              rates:
                - lpName: CalPERS
                  classification: Rated
                  ubsAdvRatePct: 0.90
                  ubsConcLimitPct: 0.075
                  source: BATCH_FEED
      responses:
        '201':
          description: Number of `lp_rates` rows inserted or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: integer, description: Count of rows upserted }
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Borrowing Base ───────────────────────────────────────────────────────────

  /bb/run/{facilityId}:
    post:
      tags: [borrowing-base]
      summary: Compute Shadow BB, persist snapshot, update facility lastRunAt
      operationId: runBB
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '201':
          description: New snapshot record containing the full BBResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BBSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'

  /bb/snapshots/{facilityId}:
    get:
      tags: [borrowing-base]
      summary: All snapshots for a facility ordered by calculatedAt ascending
      operationId: listBBSnapshots
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: Array of snapshot records (result jsonb included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BBSnapshot'

  /bb/snapshots/{facilityId}/latest:
    get:
      tags: [borrowing-base]
      summary: Latest snapshot for a facility
      operationId: getLatestBBSnapshot
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: Most recent snapshot record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BBSnapshot'
        '204':
          description: No snapshot exists yet for this facility

  /bb/summary-ext/{facilityId}:
    get:
      tags: [borrowing-base]
      summary: >
        Extended portfolio summary for the Shadow BB screen (five-table view:
        LP Portfolio, Borrowing Base, BUSA rates, Agent rates, LP Classification)
      operationId: getBBSummaryExt
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: >
            Extended summary object. Computed from the lps table for the given facility
            and merged with latest snapshot BB totals. Returns zero-valued object (not 404)
            when the facility has no LP records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BBSummaryExt'

  # ── Reports ──────────────────────────────────────────────────────────────────

  /reports/collateral/{facilityId}:
    get:
      tags: [reports]
      summary: Collateral Market Value & Coverage — BB certificate data from a snapshot
      operationId: getCollateralReport
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
        - name: snapshotId
          in: query
          schema:
            type: integer
          description: >
            Report on a specific snapshot of this facility. Omit for the latest snapshot.
            404 if the snapshot does not exist or belongs to another facility.
      responses:
        '200':
          description: Certificate payload — facility identity, snapshot summary, and LP category breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  facilityId:
                    type: integer
                  facilityName:
                    type: string
                  agentBank:
                    type: string
                  snapshotId:
                    type: integer
                  calculatedAt:
                    type: string
                    format: date-time
                  summary:
                    $ref: '#/components/schemas/BBSummary'
                  totalEligibleUncalledM:
                    type: number
                    description: Sum of eligible uncalled capital across LPs ($ millions)
                  classBreakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        cls:
                          type: string
                          description: LP category label (legacy tiers first, canonical order)
                        count:
                          type: integer
                        uncalledM:
                          type: number
                        ubbM:
                          type: number
                        rate:
                          type: string
                          description: UBS advance rate for the tier, e.g. "90%"
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/concentration/{facilityId}:
    get:
      tags: [reports]
      summary: Concentration Exposures — breach list from the latest snapshot
      description: >
        Breaches are detected during each Shadow BB run using the thresholds stored in the
        `conc_limits` config key (Config screen → Concentration Limits), matched by row label
        (`Single LP max`, `Top-10 LP max`, `Unrated max (aggregate)`, `Non-US LP max`); missing
        rows fall back to the seeded defaults (15/60/50/30%). The top-10 rule emits a `warning`
        within 10 percentage points below its configured limit.
      operationId: getConcentrationReport
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: Array of concentration breaches/warnings
          content:
            application/json:
              schema:
                type: object
                properties:
                  breaches:
                    type: array
                    items:
                      $ref: '#/components/schemas/BBBreach'
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/ear/{facilityId}:
    get:
      tags: [reports]
      summary: Effective Advance Rate history across all snapshots
      operationId: getEARReport
      parameters:
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: Array of EAR data points ordered by calculatedAt (oldest first; empty when no snapshots)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    calculatedAt:
                      type: string
                      format: date-time
                    ear:
                      type: number
                      description: UBS Effective Advance Rate (totalUBB / totalUEC)
                    agentEar:
                      type: number
                    earDelta:
                      type: number
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/agent-banks:
    get:
      tags: [reports]
      summary: UBS exposure aggregated by agent bank from each facility's latest snapshot
      operationId: getAgentBankExposure
      responses:
        '200':
          description: One row per agent bank, sorted by UBS BB descending ($ millions)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    agentBank:
                      type: string
                    facilityCount:
                      type: integer
                      description: All facilities for the bank, including those without a snapshot
                    lpCount:
                      type: integer
                    ubsBBM:
                      type: number
                    agentBBM:
                      type: number
                    deltaM:
                      type: number
                      description: ubsBBM − agentBBM

  /reports/history:
    get:
      tags: [reports]
      summary: Report generation history (50 most recent, newest first)
      operationId: listReportHistory
      responses:
        '200':
          description: Array of report history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportHistoryEntry'
    post:
      tags: [reports]
      summary: Record a generated report
      operationId: recordReportHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report]
              properties:
                report:
                  type: string
                  description: Report name, e.g. "Collateral & Coverage"
                facilityId:
                  type: integer
                  description: Omit for portfolio-wide reports
                snapshotLabel:
                  type: string
                format:
                  type: string
                  description: PDF / XLSX / Both
      responses:
        '201':
          description: The stored history entry (userName resolved from the request identity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportHistoryEntry'
        '400':
          description: Missing report name
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Submissions ───────────────────────────────────────────────────────────────

  /submissions:
    get:
      tags: [submissions]
      summary: List all submissions
      operationId: listSubmissions
      parameters:
        - name: facilityId
          in: query
          schema:
            type: integer
          description: Filter by facility; omit for all submissions
      responses:
        '200':
          description: Array of submission records ordered newest first (Processing status filtered out)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
    post:
      tags: [submissions]
      summary: Create a new submission (document upload); triggers extraction immediately
      operationId: createSubmission
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [facilityId, agentBank, periodMonth, file]
              properties:
                facilityId:
                  type: integer
                agentBank:
                  type: string
                periodMonth:
                  type: string
                  description: Date string passed from the UI e.g. "2026-05-31"
                file:
                  type: string
                  format: binary
                  description: Agent BB Excel file; max 50 MB
                notes:
                  type: string
                  description: Optional analyst notes
      responses:
        '201':
          description: Created submission record; extraction pipeline runs asynchronously — status is Processing until extraction completes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: facilityId does not exist

  /submissions/{id}:
    get:
      tags: [submissions]
      summary: Get a single submission
      operationId: getSubmission
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Submission record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/{id}/abort:
    post:
      tags: [submissions]
      summary: Abort a submission — deletes extraction record, match queue entries, uploaded file, and resets facility status
      operationId: abortSubmission
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Submission aborted; no response body
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot abort — submission is already Processed or already Aborted

  /submissions/{id}/complete:
    post:
      tags: [submissions]
      summary: Accept Shadow BB results — marks submission Processed and facility Active
      description: >
        Called by the Run Shadow BB screen after the credit officer reviews and accepts the
        calculation results. Sets `submission.status = "Processed"`, `submission.wizardStep = 6`,
        `facility.status = "Active"`, and stamps `facility.lastRunAt` to the current time.
        No Shadow BB certificate is produced — accepting the run is sufficient (see OPEN_QUESTIONS R2/R3).
        Idempotent — calling it more than once is safe and returns the same state.
        Writes a `Shadow BB Completed` audit event.
      operationId: completeSubmission
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated submission record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/{id}/confirm:
    post:
      tags: [submissions]
      summary: Confirm extraction; advances wizard to step 4, auto-learns BB template, builds match queue
      description: >
        Confirms the extraction result. Advances the submission to `wizardStep = 4`.
        On first confirmation for a given agent bank, the sheet name and header row
        from the extraction are saved to `bb_templates` so subsequent uploads from
        the same bank bypass heuristic sheet/header detection.
        Also (re)builds the `match_queue_entries` for the submission from the
        extracted LP rows. Does NOT set submission status to Processed.
      operationId: confirmSubmission
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/{id}/shadow-bb-state:
    patch:
      tags: [submissions]
      summary: Advance submission to wizard step 5; optionally persist Shadow BB overrides
      description: >
        Called on "Commit Decisions" (no overrides) and on "Save" (with LP classification/rate
        overrides set by the credit officer on the Run Shadow BB screen).
        Advances `wizardStep` to 5 and stores the overrides JSON in `shadow_bb_overrides`.
      operationId: saveShadowBbState
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides:
                  type: object
                  nullable: true
                  description: Per-LP classification/rate overrides keyed by LP id
      responses:
        '200':
          description: Updated submission record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/{id}/remap:
    post:
      tags: [submissions, extraction]
      summary: Map an unrecognised column to a canonical field, then immediately re-extracts
      description: >
        Saves a User-tier alias mapping for the extracted column header to the given
        canonical LP field (`fm_aliases` table). If the alias does not already exist it
        is created and an audit event is written. Re-extraction is then triggered
        immediately using the stored file — the extraction result in
        `submission_extractions` is updated in place.

        Returns `200 OK` with an empty body on success. If the alias was saved but
        `pe-sub-extraction` is unreachable, returns `502 Bad Gateway`; the alias is
        preserved and re-extraction can be retried via `POST /{id}/reextract`.
      operationId: remapSubmissionColumn
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extractedHeader, canonical]
              properties:
                extractedHeader:
                  type: string
                  description: The unrecognised column header string as it appears in the document
                canonical:
                  type: string
                  description: The canonical field name to map it to (e.g. "UNCALLED")
      responses:
        '200':
          description: Alias saved and re-extraction complete
        '400':
          description: No stored file for this submission, or unknown canonical field
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Alias saved but pe-sub-extraction unreachable; retry via POST /{id}/reextract

  /submissions/{id}/reextract:
    post:
      tags: [submissions, extraction]
      summary: Re-run extraction pipeline for this submission using the stored file
      description: >
        Calls `pe-sub-extraction` again using the original uploaded file plus any
        saved column remappings and the BB template hint (if known for this agent bank).
        The `submission_extractions` record is updated in place.
        Writes a `Re-extraction` audit event on success.
      operationId: reextractSubmission
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Re-extraction complete; extraction record updated in place
        '400':
          description: No stored file for this submission
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: pe-sub-extraction service unreachable

  # ── Audit ────────────────────────────────────────────────────────────────────

  /audit:
    get:
      tags: [audit]
      summary: List all audit log entries ordered newest first
      operationId: listAuditLog
      responses:
        '200':
          description: Array of audit rows; facility name is denormalized for display
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditRow'

  /audit/login:
    post:
      tags: [audit]
      summary: Record a Login event for the current session
      description: >
        Called by the UI on app mount. Writes a Login entry with the real
        client IP (from `X-Forwarded-For` or `remoteAddr`). User name is
        hardcoded to `J. Smith` pending authentication integration.
      operationId: recordLogin
      responses:
        '200':
          description: Login event recorded

  # ── Extraction ───────────────────────────────────────────────────────────────

  /submissions/{id}/extracted-lps:
    get:
      tags: [extraction]
      summary: Extracted LP rows from the submitted document
      operationId: getExtractedLPs
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: >
            Array of extracted LP rows stored in `submission_extractions.extracted_lps` JSONB.
            Each row contains formatted field values and per-row confidence/review flags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtractedLP'

  /submissions/{id}/field-map:
    get:
      tags: [extraction]
      summary: Column-to-canonical-field mapping for this submission
      operationId: getFieldMap
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: >
            Array of field mapping entries — one per recognised column — ordered as they
            appear in the extraction result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldMapEntry'

  /submissions/{id}/doc-recognition:
    get:
      tags: [extraction]
      summary: Document recognition metadata (bank detected, sheet name, header row, row counts)
      operationId: getDocRecognition
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Document recognition result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRecognition'
        '404':
          $ref: '#/components/responses/NotFound'

  /submissions/{id}/unrecognized-columns:
    get:
      tags: [extraction]
      summary: Column headers that could not be mapped to any canonical field
      operationId: getUnrecognizedColumns
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Array of unrecognized column header strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ── Field Mapping ─────────────────────────────────────────────────────────────

  /field-mapping/alias-groups:
    get:
      tags: [field-mapping]
      summary: Alias-group dictionary — maps agent column headers to canonical LP fields
      operationId: getAliasGroups
      responses:
        '200':
          description: Array of alias group objects grouped by LP Master section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AliasGroup'

  /field-mapping/canonical-fields:
    get:
      tags: [field-mapping]
      summary: All canonical LP Master field names as value/label/extractable triples
      operationId: getCanonicalFields
      responses:
        '200':
          description: Array of canonical field objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:      { type: string, description: Canonical field name }
                    label:      { type: string, description: Group-prefixed label e.g. "Identity & Classification › Investor Name" }
                    extractable: { type: boolean, description: True if pe-sub-extraction can populate this field from agent documents }

  /field-mapping/blocklist:
    get:
      tags: [field-mapping]
      summary: Global blocklist — qualifier terms that must never be mapped
      operationId: getBlocklist
      responses:
        '200':
          description: Array of blocklist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlocklistEntry'

  /field-mapping/suggestions:
    get:
      tags: [field-mapping]
      summary: Pending alias suggestions submitted by users or the AI engine
      operationId: getSuggestions
      responses:
        '200':
          description: Array of pending alias suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FmSuggestion'
    post:
      tags: [field-mapping]
      summary: Submit a new alias suggestion
      operationId: createSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extractedHeader, canonicalField]
              properties:
                extractedHeader: { type: string }
                canonicalField:  { type: string }
                suggestedBy:     { type: string, nullable: true }
      responses:
        '201':
          description: Created suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FmSuggestion'

  /field-mapping/aliases:
    post:
      tags: [field-mapping]
      summary: Add a new alias to a canonical field
      operationId: createAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canonicalFieldId, text]
              properties:
                canonicalFieldId: { type: integer }
                text: { type: string }
                tier: { type: string, enum: [Core, Bank, User], default: Bank }
                bank: { type: string, nullable: true }
      responses:
        '201':
          description: Created alias; audit event written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasEntry'
        '409':
          description: Alias text already mapped to another canonical field

  /field-mapping/aliases/{id}:
    delete:
      tags: [field-mapping]
      summary: Remove an alias
      operationId: deleteAlias
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Alias deleted; audit event written
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [field-mapping]
      summary: Update alias text and/or bank
      operationId: updateAlias
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                bank: { type: string, nullable: true }
      responses:
        '200':
          description: Updated alias; audit event written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: New alias text already mapped to another canonical field

  # ── Matching ─────────────────────────────────────────────────────────────────

  /matching/test:
    post:
      tags: [matching]
      summary: Test LP name matching — returns ranked candidates with scores and actions
      operationId: testLPNameMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Investor name to test
      responses:
        '200':
          description: Ranked match candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTestResult'
        '400':
          description: name is blank

  /matching/queue:
    get:
      tags: [matching]
      summary: Name-matching queue; optionally filtered by submission
      operationId: getMatchQueue
      parameters:
        - name: submissionId
          in: query
          required: false
          schema:
            type: integer
          description: Filter by submission; omit to return all queue entries
      responses:
        '200':
          description: Array of match candidates with scores and decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchQueueItem'

  /matching/queue/decisions:
    patch:
      tags: [matching]
      summary: Apply many accept/reject decisions in one request (batch)
      description: >
        Collapses the per-row PATCHes a bulk Accept/Reject would otherwise fire into a single
        request applied in one transaction. The literal "decisions" segment is matched ahead of
        /matching/queue/{id}, so it does not collide with the single-decision endpoint. Ids that
        do not exist are skipped; only the entries actually updated are returned.
      operationId: updateMatchDecisionsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, decision]
                    properties:
                      id:
                        type: integer
                        description: Match queue entry id
                      decision:
                        type: string
                        enum: [accepted, rejected, manual]
                        description: Decision value (case-insensitive; stored capitalised)
                      masterName:
                        type: string
                        description: >
                          When provided and non-blank, sets masterNameOverride and forces
                          decision to Accepted regardless of the decision field
      responses:
        '200':
          description: The updated match queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchQueueItem'
        '400':
          description: Validation failed (empty decisions list, or a missing id/decision)

  /matching/queue/{id}:
    patch:
      tags: [matching]
      summary: Accept or reject a single match decision
      operationId: updateMatchDecision
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [accepted, rejected, manual]
                  description: Decision value (case-insensitive; stored capitalised)
                masterName:
                  type: string
                  description: >
                    When provided and non-blank, sets masterNameOverride and forces
                    decision to Accepted regardless of the decision field
      responses:
        '200':
          description: Updated match queue item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchQueueItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /matching/thresholds:
    get:
      tags: [matching]
      summary: Current name-matching score thresholds  [planned — use GET /config/matching instead]
      operationId: getMatchThresholds
      responses:
        '200':
          description: Threshold configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchThresholds'
    patch:
      tags: [matching]
      summary: Update name-matching score thresholds  [planned — use PUT /config/matching instead]
      operationId: updateMatchThresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchThresholds'
      responses:
        '200':
          description: Updated thresholds

  # ── BB Templates ──────────────────────────────────────────────────────────────

  /bb-templates/import:
    post:
      tags: [extraction]
      summary: Import a structured BB template workbook (XLSX)
      description: >
        Imports a `BB-Template-Import-*.xlsx` workbook and creates the corresponding
        `bb_templates` row (with tabs). With `mode=upsert` an existing template with the
        same `template_slug` is replaced instead of rejected, making the import idempotent —
        this is how `pe-sub-jobs` pushes workbooks from its watched `data/bb-templates/`
        directory on startup and rescan.
      operationId: importBbTemplate
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [create, upsert]
            default: create
          description: create rejects duplicate template slugs; upsert replaces them in place
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Imported template profile including parsed tabs
          content:
            application/json:
              schema:
                type: object
                description: BB template profile (BbTemplateDto)
                properties:
                  id:             { type: integer }
                  templateSlug:   { type: string }
                  templateName:   { type: string }
                  agentName:      { type: string }
                  templateClass:  { type: string }
                  sheetName:      { type: string, nullable: true }
                  headerRowIndex: { type: integer, nullable: true }
                  autoLearned:    { type: boolean }
                  tabs:           { type: array, items: { type: object } }

  # ── Config ────────────────────────────────────────────────────────────────────

  /config/classification:
    get:
      tags: [config]
      summary: LP classification options, rate maps, and qualifying criteria
      operationId: getClassificationConfig
      responses:
        '200':
          description: Classification configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationConfig'
        '404':
          description: No classification config key found in DB

  /config/eligibility:
    get:
      tags: [config]
      summary: BUSA/Agent rate tiers, eligibility rules, and concentration limits
      operationId: getEligibilityConfig
      responses:
        '200':
          description: >
            Eligibility configuration assembled from DB cache. Response keys are
            SCREAMING_SNAKE_CASE, each present only if its config key is seeded:
            `BUSA_TIERS`, `AGENT_TIERS`, `CONC_LIMITS`, `CLS_CONC_LIMIT_DEFAULTS`,
            `CLS_CONC_LIMIT_BOUNDS`, `BB_CRITERIA_MATRIX`, `GLOBAL_SETTINGS`.
            Returns 404 if no eligibility keys have been seeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityConfig'
        '404':
          description: No eligibility config keys found in DB
    put:
      tags: [config]
      summary: Upsert a single eligibility config key
      operationId: updateEligibilityConfig
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [busa_tiers, agent_tiers, conc_limits, cls_conc_limit_defaults, cls_conc_limit_bounds, bb_criteria_matrix, global_settings]
          description: Config key being updated — stored as-is and used as audit log detail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The new JSON value for the given config key
      responses:
        '200':
          description: Updated config value echoed back; audit event written

  /config/cls-conc-limit-defaults:
    patch:
      tags: [config, jobs]
      summary: Merge per-classification default concentration limits (SERVICE role)
      description: >
        Called by `pe-sub-jobs`' cls-conc-limits feed. Merges the fed classes into the
        `cls_conc_limit_defaults` config map (percent of total uncalled capital per LP
        classification): fed classes overwrite their entries, unmentioned classes are
        preserved. Persists and refreshes the in-memory cache in one step — no follow-up
        `/config/reload` is needed. Operators edit the same map via
        `PUT /config/eligibility?section=cls_conc_limit_defaults` instead.
      operationId: mergeClsConcLimitDefaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: number }
            example:
              Rated Investor: 20.0
              Unrated NAV > $1Bn: 15.0
      responses:
        '200':
          description: The full merged defaults map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: number }
        '400':
          description: Empty body — nothing to merge

  /config/reload:
    post:
      tags: [config]
      summary: Reload the in-memory config cache from the database
      description: >
        Re-reads the whole `config` table into the service's in-memory cache — a recovery
        hook for out-of-band changes to the `config` table. (The pe-sub-jobs config feed no
        longer needs it: `PATCH /config/cls-conc-limit-defaults` refreshes the cache itself.)
      operationId: reloadConfig
      responses:
        '204':
          description: Cache reloaded

  /config/wizard:
    get:
      tags: [config]
      summary: Upload wizard steps, snapshot options, and calculation modes
      operationId: getWizardConfig
      responses:
        '200':
          description: Wizard configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardConfig'
        '404':
          description: wizard_config key not yet seeded in DB

  /config/audit:
    get:
      tags: [config]
      summary: Audit trail event types, retention label, and default date range
      operationId: getAuditConfig
      responses:
        '200':
          description: Audit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditConfig'
        '404':
          description: audit_config key not yet seeded in DB

  /config/matching:
    get:
      tags: [config]
      summary: Matching config — legal suffixes, abbreviation dictionary, thresholds
      operationId: getMatchingConfig
      responses:
        '200':
          description: Matching configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingConfig'
        '404':
          description: matching_config key not yet seeded in DB
    put:
      tags: [config]
      summary: Replace matching config
      operationId: updateMatchingConfig
      parameters:
        - name: section
          in: query
          schema:
            type: string
          description: Config section label used in audit log detail (e.g. "thresholds", "weights", "suffixes", "abbreviations")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingConfig'
      responses:
        '200':
          description: Updated matching config; audit event written (`Match Config Change`)

  /config/reports:
    get:
      tags: [config]
      summary: Report tabs, certificate options, and scheduled report definitions
      operationId: getReportsConfig
      responses:
        '200':
          description: Reports configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsConfig'
        '404':
          description: report_config key not yet seeded in DB

  # ── Notifications ─────────────────────────────────────────────────────────────

  /notifications/events:
    get:
      tags: [notifications]
      summary: Server-Sent Events stream for real-time platform events
      operationId: subscribeNotifications
      description: >
        Returns a persistent SSE stream. The server pushes plain-text event messages
        for facility status changes, BB runs, LP reclassifications, and upload events.
        Each event arrives as a `data: <message>` line. Keep the connection open;
        it does not time out under normal operation.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  # ── Security schemes ─────────────────────────────────────────────────────────
  # Gateway mode: the SSO reverse proxy injects the caller's identity and roles as headers.
  # Dev mode injects a fixed identity server-side, so these are not required locally.

  securitySchemes:
    GatewayUser:
      type: apiKey
      in: header
      name: X-Auth-User
      description: Authenticated user id/email, injected by the SSO reverse proxy (gateway mode).
    GatewayRoles:
      type: apiKey
      in: header
      name: X-Auth-Roles
      description: Comma-separated roles, e.g. "ANALYST,ATM" (gateway mode).

  # ── Parameters ───────────────────────────────────────────────────────────────

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer

    FacilityIdPath:
      name: facilityId
      in: path
      required: true
      schema:
        type: integer

  # ── Responses ────────────────────────────────────────────────────────────────

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ── Schemas ───────────────────────────────────────────────────────────────────

  schemas:

    # ── Enums ──────────────────────────────────────────────────────────────────

    FacilityStatus:
      type: string
      enum: [Not Started, In Progress, Needs Review, Active, Pending, Inactive]

    LPClassification:
      type: string
      description: >
        UBS LP classification. As of July 2026 the UBS and analyst-entered classification
        vocabularies are unified (CLS_OPTS == UBS_CLS_OPTS in classification_config).
      enum: [Rated Investor, Unrated NAV > $1Bn, FoF & Other > $10Bn AUM, Corp Pension > $5Bn Assets, Other Institutional, Excluded]

    Region:
      type: string
      enum: [North America, Europe, Asia-Pacific, Middle East, Other]

    InvestorType:
      type: string
      enum: [Institutional, HNW]

    # ── Core records ───────────────────────────────────────────────────────────

    Facility:
      type: object
      required: [id, name, agentBank, status, concLimitM, lpCount, createdAt, updatedAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        agentBank:   { type: string }
        status:      { $ref: '#/components/schemas/FacilityStatus' }
        concLimitM:  { type: number, description: Per-LP concentration limit in $M, example: 25 }
        lpCount:     { type: integer, description: Number of LP records persisted for this facility, example: 900 }
        accountNumber:  { type: string, nullable: true, description: UBS internal identifier e.g. "5VX1796" }
        loanAmount:     { type: number, nullable: true, description: Committed facility size in dollars from Agent Bank Summary }
        maturityDate:   { type: string, format: date, nullable: true, description: Facility maturity date }
        collateralDate: { type: string, format: date, nullable: true, description: Collateral as-of date from Agent Bank Summary }
        bankStatus:     { type: string, nullable: true, description: Agent-reported facility status }
        bankStatusDate: { type: string, format: date, nullable: true, description: Most recent agent-reported status date }
        facilitySize:     { type: number, nullable: true, description: Stated facility commitment in dollars (Shadow BB Borrowing Base input) }
        ubsParticipation: { type: number, nullable: true, description: UBS's participation share of the facility in dollars (Shadow BB Borrowing Base input) }
        agentBB:     { type: number, nullable: true, description: Latest snapshot's Agent Borrowing Base in $millions; null until a BB is run }
        ubsBB:       { type: number, nullable: true, description: Latest snapshot's UBS Borrowing Base in $millions; null until a BB is run }
        bbDelta:     { type: number, nullable: true, description: Latest snapshot's UBS − Agent BB delta in $millions; null until a BB is run }
        ear:         { type: number, nullable: true, description: Latest snapshot's UBS effective advance rate (fraction); null until a BB is run }
        lastRunAt:   { type: string, format: date-time, nullable: true }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    LP:
      type: object
      required: [id, facilityId, name, cls, inc]
      description: LP Master record — mirrors Step 4 (Final Shadow BB) field set from BB_PROCESS_FLOW
      properties:
        # Identity
        id:            { type: integer }
        facilityId:    { type: integer }
        name:          { type: string }
        parent:        { type: string, nullable: true }
        spv:           { type: boolean }
        hq:            { type: boolean }
        fundSleeve:    { type: string, nullable: true, description: Fund sleeve the LP commits through; each workbook sheet is an independent sleeve }
        type:          { $ref: '#/components/schemas/InvestorType' }
        region:        { $ref: '#/components/schemas/Region' }
        ig:            { type: boolean, description: Investment Grade flag }
        agentCls:      { type: string, nullable: true, description: Agent LP Category (verbatim from Agent BB or derived) }
        agentClsSource: { type: string, nullable: true, enum: [EXTRACTED, DERIVED, USER_EDITED], description: Provenance of agentCls }
        cls:           { $ref: '#/components/schemas/LPClassification' }
        clsTag:        { type: string, description: CSS tag class e.g. tag-rated }
        # Ratings
        sp:            { type: string, default: NR }
        mdy:           { type: string, default: NR }
        fitch:         { type: string, default: NR }
        # Financial scale (formatted strings e.g. "$3.8B")
        aum:           { type: string, nullable: true }
        nav:           { type: string, nullable: true }
        pension:       { type: string, nullable: true }
        pensionFunded: { type: string, nullable: true }
        # Commitment data
        capCommit:     { type: string, nullable: true, description: Capital commitment e.g. "$250.0M" }
        pctCapCommit:  { type: string, nullable: true }
        calledCap:     { type: string, nullable: true }
        # Uncalled capital
        uc:            { type: string, description: Uncalled capital e.g. "$28.4M" }
        pctUncalled:   { type: string, nullable: true }
        pctCalled:     { type: string, nullable: true }
        # Concentration & BB
        agentConc:     { type: string, nullable: true }
        ubsConc:       { type: string, nullable: true, description: Per-LP UBS concentration limit as a percent of total uncalled capital e.g. "7.5%" }
        ubsRate:       { type: string, nullable: true, description: Per-LP UBS advance rate percent e.g. "90%" (matrix-resolved default or manual override); persisted so it round-trips to LP Master }
        agentRate:     { type: string, nullable: true }
        abb:           { type: string, default: '$0', description: Agent-submitted borrowing base }
        rank:          { type: integer, nullable: true, description: Uncalled-capital rank within the facility; computed and persisted by the Shadow BB run }
        # Status flags
        inc:           { type: boolean, description: UBS Included flag }
        rcl:           { type: boolean, description: Reclassified flag }
        tf:            { type: boolean, description: Transfer flag }
        notes:         { type: string, nullable: true }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }

    LpMaster:
      type: object
      description: >
        Bank-wide LP Master record — the standardized upstream LP reference shared across
        facilities. Distinct from LP (a per-facility record). Field names use snake_case for
        investor_type / inst_vs_hnw / region_location to match the persisted contract.
      required: [id, name, cls]
      properties:
        id:              { type: integer }
        name:            { type: string }
        parent:          { type: string, nullable: true }
        spv:             { type: boolean }
        hq:              { type: boolean }
        investor_type:   { type: string, nullable: true, description: Industry/sector profile e.g. "Pension Fund" }
        inst_vs_hnw:     { type: string, nullable: true }
        region_location: { type: string, nullable: true }
        ig:              { type: boolean, description: Investment Grade flag }
        cls:             { $ref: '#/components/schemas/LPClassification' }
        sp:              { type: string, default: NR }
        mdy:             { type: string, default: NR }
        fitch:           { type: string, default: NR }
        aum:             { type: string, nullable: true }
        nav:             { type: string, nullable: true }
        pension:         { type: string, nullable: true }
        pensionFunded:   { type: string, nullable: true }
        rate:            { type: string, nullable: true, description: UBS default advance rate e.g. "90%" }
        ubsConc:         { type: string, nullable: true, description: UBS default concentration limit percent e.g. "7.5%" }
        notes:           { type: string, nullable: true }

    LPPatch:
      type: object
      description: Partial LP update — any subset of mutable LP fields
      properties:
        agentCls:   { type: string, description: Agent LP Category; setting it marks agentClsSource as USER_EDITED }
        cls:        { $ref: '#/components/schemas/LPClassification' }
        clsTag:     { type: string, description: CSS tag class e.g. tag-rated }
        abb:        { type: string, description: Agent-submitted borrowing base value }
        agentRate:  { type: string }
        agentConc:  { type: string }
        ubsConc:    { type: string }
        inc:        { type: boolean }
        rcl:        { type: boolean }
        notes:      { type: string }

    # ── Borrowing Base ─────────────────────────────────────────────────────────

    BBParams:
      type: object
      properties:
        concLimitM: { type: number, description: Per-LP concentration limit in $M, example: 25 }

    BBSummary:
      type: object
      description: Portfolio-level Shadow BB metrics
      properties:
        totalUBB:
          type: number
          description: >
            Total UBS Borrowing Base ($M).
            Formula: sum(included LPs, uecM * ubsAdvRate).
            An LP is included when inc=true AND cls != "Excluded".
        totalABB:
          type: number
          description: >
            Total Agent Borrowing Base ($M).
            Formula: sum(all LPs, abbM) where abbM is the agent-reported BB figure extracted from the schedule.
        bbDelta:
          type: number
          description: >
            UBS BB minus Agent BB ($M). Formula: totalUBB - totalABB.
            Positive means UBS is more generous; negative means agent is more generous.
        ear:
          type: number
          description: >
            UBS Effective Advance Rate (decimal). Formula: totalUBB / totalUEC.
            Represents the blended advance rate across all included eligible uncalled capital.
        agentEar:
          type: number
          description: >
            Agent Effective Advance Rate (decimal). Formula: totalABB / totalUEC.
            Uses the same totalUEC denominator as UBS EAR for comparability.
        earDelta:
          type: number
          description: UBS EAR minus Agent EAR (decimal). Formula ear - agentEar.
        totalUEC:
          type: number
          description: >
            Total UBS Eligible Uncalled Capital ($M).
            Formula: sum(included LPs, uecM) where uecM = MIN(ucM, concLimitM).
            concLimitM = concLimitPct * totalUncalledM for the facility.
        totalUC:
          type: number
          description: Total Uncalled Capital of included LPs ($M) - the raw uncalled before the concentration cap is applied.
        totalConcExcess:
          type: number
          description: >
            Total concentration excess ($M). Formula: sum(all LPs, MAX(0, ucM - uecM)).
            Non-zero for any LP whose uncalled capital exceeds its per-LP concentration limit.
        includedCount:
          type: integer
          description: >
            Number of LPs included in the UBS BB. Formula: count of LPs where inc=true AND cls != "Excluded".
            Note: LPs that are included but have zero uncalled (ucM=0) still count.
        excludedCount:
          type: integer
          description: Number of LPs with cls = "Excluded".
        reclassCount:
          type: integer
          description: Number of LPs where the credit officer changed the classification from the LP Master value (rcl=true).
        calculatedAt:    { type: string, format: date-time }
        params:          { $ref: '#/components/schemas/BBParams' }

    ComputedLP:
      allOf:
        - $ref: '#/components/schemas/LP'
        - type: object
          description: LP record with all derived Shadow BB fields appended by the calculation engine
          properties:
            uec:         { type: string, description: Formatted UBS Eligible Uncalled Cap e.g. "$25.0M" }
            uecM:        { type: number, description: UBS Eligible Uncalled Cap in $M }
            ubbM:        { type: number, description: UBS Borrowing Base in $M }
            abbM:        { type: number, description: Agent BB in $M }
            deltaM:      { type: number, description: UBS BB minus Agent BB in $M }
            concExcessM: { type: number, description: Uncalled above per-LP cap in $M }
            busaRate:    { type: number, description: BUSA advance rate as decimal e.g. 0.90 }
            highQuality: { type: boolean, description: "true for Rated Investor / Unrated NAV > $1Bn / FoF & Other > $10Bn AUM / Corp Pension > $5Bn Assets" }
            ubb:         { type: string, description: Formatted UBS BB e.g. "$22.5M" }
            delta:       { type: string, description: Formatted delta e.g. "–$3.5M" }
            rate:        { type: string, description: Formatted BUSA rate e.g. "90%" }

    BBBreach:
      type: object
      properties:
        type:     { type: string, enum: [single-lp, top10, unrated, non-us], description: Concentration test that tripped }
        severity: { type: string, enum: [breach, warning] }
        message:  { type: string, description: Human-readable detail incl. the LP or group }
        value:    { type: number, description: Actual concentration as a decimal fraction, e.g. 0.518 }
        limit:    { type: number, description: Credit agreement limit as a decimal fraction, e.g. 0.5 }

    ReportHistoryEntry:
      type: object
      description: One generated report (report_history table, V1_4__report_history.sql)
      properties:
        id:            { type: integer }
        report:        { type: string }
        facilityId:    { type: integer, nullable: true, description: Null for portfolio-wide reports }
        facilityName:  { type: string, nullable: true, description: Denormalised — survives facility deletion }
        snapshotLabel: { type: string, nullable: true }
        format:        { type: string, nullable: true }
        userName:      { type: string, nullable: true }
        createdAt:     { type: string, format: date-time }

    BBResult:
      type: object
      description: Full output of computePortfolioBB — stored as jsonb in bbSnapshots.result
      properties:
        lps:      { type: array, items: { $ref: '#/components/schemas/ComputedLP' } }
        summary:  { $ref: '#/components/schemas/BBSummary' }
        breaches: { type: array, items: { $ref: '#/components/schemas/BBBreach' } }

    BBSnapshot:
      type: object
      description: Append-only snapshot — latest per facility is the current Shadow BB
      properties:
        id:           { type: integer }
        facilityId:   { type: integer }
        calculatedBy: { type: integer, nullable: true, description: FK → users.id }
        calculatedAt: { type: string, format: date-time }
        result:       { $ref: '#/components/schemas/BBResult' }

    RateBreakdownRow:
      type: object
      properties:
        rate:    { type: string, description: Rate label e.g. "90%" }
        count:   { type: integer }
        dollars: { type: number, description: Total uncalled capital in dollars }
        pct:     { type: number, description: Fraction of total uncalled e.g. 0.37 }

    ClassBreakdownRow:
      type: object
      properties:
        label:   { type: string, description: Classification label e.g. "Rated Investors" }
        count:   { type: integer }
        dollars: { type: number }
        pct:     { type: number }

    BBSummaryExt:
      type: object
      description: >
        Extended portfolio summary powering the five-table Shadow BB summary panel
        (LP Portfolio, Borrowing Base, BUSA rates, Agent rates, LP Classification).
        All monetary fields and breakdown `dollars` values are expressed in $millions;
        the UI renders them as full dollars or abbreviated "$M" depending on panel width.
      properties:
        # LP Portfolio table
        totalCapCommit:     { type: number, description: Total capital commitments in $millions }
        totalCalledCap:     { type: number, description: Total called capital in $millions (Capital Commitments − Uncalled, derived when not stored) }
        pctCalled:          { type: number }
        totalAllUncalled:   { type: number, description: Total uncalled across all LPs in $millions }
        totalLPs:           { type: integer }
        pctInstitutional:   { type: number, description: Institutional LPs' uncalled share of total uncalled }
        pctHNW:             { type: number, description: HNW LPs' uncalled share of total uncalled }
        pctTop10:           { type: number, description: Top-10 LPs share of total uncalled }
        pctTop20:           { type: number }
        igRatio:            { type: number, description: Investment-grade LPs' uncalled share of total uncalled }
        pctUncalledGt25bnAum: { type: number, description: Uncalled share from LPs with AUM > $25bn }
        # Borrowing Base table (monetary fields in $millions)
        facilitySize:        { type: number, description: Stated facility commitment in $millions }
        ubsParticipation:    { type: number, description: UBS participation share in $millions }
        ubsParticipationPct: { type: number, description: UBS Participation ÷ Total Facility Size }
        facilityLTV:         { type: number, description: Total Facility Size ÷ Total Uncalled }
        availableCommit:     { type: number, description: MIN(Total Facility Size, Agent BB) in $millions }
        facilityAdvRate:     { type: number, description: Agent BB ÷ Total Uncalled }
        agentBBRaw:          { type: number, description: Agent BB in $millions }
        ubsBBRaw:            { type: number, description: UBS BB in $millions }
        ubsAdvRate:          { type: number }
        # Breakdown tables
        busaBreakdown:  { type: array, items: { $ref: '#/components/schemas/RateBreakdownRow' } }
        agentBreakdown: { type: array, items: { $ref: '#/components/schemas/RateBreakdownRow' } }
        clsBreakdown:   { type: array, items: { $ref: '#/components/schemas/ClassBreakdownRow' } }

    # ── Submissions & Extraction ───────────────────────────────────────────────

    SubmissionStatus:
      type: string
      enum: [Processing, Review, Processed, Aborted, Error]
      description: >
        Processing — extraction and matching running;
        Review — awaiting credit officer action;
        Processed — Shadow BB complete;
        Aborted — cancelled by user;
        Error — extraction pipeline failed (pe-sub-extraction unreachable)

    Submission:
      type: object
      properties:
        id:                  { type: integer }
        facilityId:          { type: integer }
        facilityName:        { type: string, description: Facility name resolved from facilityId — included in list response }
        agentBank:           { type: string }
        periodMonth:         { type: string, description: Date string from the UI e.g. "2026-05-31" }
        status:              { $ref: '#/components/schemas/SubmissionStatus' }
        fileName:            { type: string, description: Original filename as uploaded }
        uploadedBy:          { type: integer, nullable: true, description: FK → users.id }
        notes:               { type: string, nullable: true, description: Optional analyst notes submitted with the upload }
        wizardStep:          { type: integer, description: "Current ingestion wizard step: 1=Uploaded, 3=Extraction Review, 4=Matching Review, 5=Shadow BB" }
        shadowBbOverrides:   { type: object, nullable: true, description: Per-LP classification/rate overrides set on the Run Shadow BB screen }
        createdAt:           { type: string, format: date-time }
        updatedAt:           { type: string, format: date-time }

    ConfirmResponse:
      type: object
      description: Response from POST /submissions/{id}/confirm
      properties:
        templateSaved:
          type: boolean
          description: True if a new BB template was learned for this agent bank
        agentBank:
          type: string
          description: Agent bank name from the submission

    ExtractedLP:
      type: object
      description: >
        Single LP row as stored in submission_extractions.extracted_lps JSONB.
        Field values are pre-formatted strings (e.g. "$28.4M", "65.0%").
      properties:
        id:            { type: integer, description: Sequential row id within this extraction }
        rowIndex:      { type: integer, description: Zero-based row index in the source spreadsheet }
        name:          { type: string }
        investorType:  { type: string, nullable: true, description: Investor Type as extracted from the schedule }
        agentClass:    { type: string, nullable: true, description: LP classification as stated by agent, or derived when blank }
        agentClsSource: { type: string, nullable: true, description: "EXTRACTED — came from the Agent BB file; DERIVED — auto-assigned from Investor Type and profile data; empty — no classification available" }
        commit:        { type: string, nullable: true, description: Formatted capital commitment }
        uncalled:      { type: string, nullable: true, description: Formatted uncalled capital }
        aum:           { type: string, nullable: true, description: Formatted AUM }
        agentRate:     { type: string, nullable: true, description: Formatted advance rate e.g. "65.0%" }
        agentConc:     { type: string, nullable: true, description: Formatted concentration limit e.g. "10.0%" }
        conf:          { type: integer, description: Overall extraction confidence 0–100 (average of field confidences) }
        requiresReview: { type: boolean }
        agentBBFmt:    { type: string, description: Computed agent BB as formatted string e.g. "$18,500,000" }
        pctBBFmt:      { type: string, description: This LP's share of total agent BB e.g. "3.42%" }
        parent:        { type: string, nullable: true }
        nav:           { type: string, nullable: true }
        sp:            { type: string, nullable: true }
        moodys:        { type: string, nullable: true }
        fitch:         { type: string, nullable: true }
        transferee:    { type: string, nullable: true }
        warnings:      { type: array, items: { type: string }, description: Field-level warning messages }

    FieldMapEntry:
      type: object
      description: Single column-to-canonical-field mapping entry from the extraction result
      properties:
        extracted:  { type: string, description: Column header as it appears in the document }
        canonical:  { type: string, description: Group-prefixed canonical label e.g. "Commitment Data — UNCALLED" }
        group:      { type: string, description: LP Master section name e.g. "Commitment Data" }
        note:       { type: string, description: Match quality note e.g. "Exact match", "Matched via fuzzy similarity", "Matched via alias dictionary" }
        tier:       { type: string, description: Always "Core" for extraction-sourced mappings }

    DocRecognition:
      type: object
      description: Document recognition metadata computed from submission_extractions
      properties:
        document:          { type: string, description: Original filename }
        format:            { type: string, description: Human-readable bank template name e.g. "Excel Workbook — Citibank template" }
        tablesIdentified:  { type: string, description: "Table summary including sheet name e.g. '1 borrowing-base table - Sheet BB Schedule'" }
        tableLocation:     { type: string, description: Row range of data e.g. "Rows 4–147" }
        headerRow:         { type: integer, description: One-based header row number }
        totalRows:         { type: integer, description: Total data rows parsed }
        mappedColumns:     { type: integer, description: Number of columns matched to canonical fields }
        unmatchedColumns:  { type: integer, description: Number of columns not matched to any canonical field }
        headerInfo:        { type: string, description: Human-readable header summary e.g. "Row 3 · 12 columns matched · 2 unmatched" }

    # ── Field Mapping ──────────────────────────────────────────────────────────

    AliasEntry:
      type: object
      properties:
        id:   { type: integer }
        text: { type: string, description: Alias text as it appears in agent documents }
        tier: { type: string, enum: [Core, Bank, User] }
        bank: { type: string, nullable: true, description: Agent bank name for Bank-tier aliases }

    AliasGroup:
      type: object
      properties:
        group:  { type: string, description: LP Master section name e.g. "Identity & Classification" }
        fields:
          type: array
          items:
            type: object
            properties:
              id:             { type: integer, description: Canonical field DB id — used when adding new aliases }
              canonical:      { type: string }
              lpMasterField:  { type: string }
              disambiguation: { type: string, nullable: true, description: Extraction hint shown in the UI }
              aliases:
                type: array
                items:
                  $ref: '#/components/schemas/AliasEntry'

    BlocklistEntry:
      type: object
      properties:
        id:        { type: integer }
        qualifier: { type: string, description: Keyword matched against column headers e.g. "Adjusted" }
        reason:    { type: string, description: Human-readable explanation }

    FmSuggestion:
      type: object
      properties:
        id:              { type: integer }
        extractedHeader: { type: string }
        canonicalField:  { type: string }
        suggestedBy:     { type: string, nullable: true }
        source:          { type: string, enum: [User, AI] }
        confidence:      { type: integer, nullable: true, description: AI confidence 0–100; null for user suggestions }
        createdAt:       { type: string, format: date-time }

    # ── Matching ───────────────────────────────────────────────────────────────

    MatchCandidate:
      type: object
      description: Single LP name match candidate with score, confidence band and recommended action
      properties:
        name:   { type: string, description: LP Master name }
        score:  { type: integer, description: Combined similarity score 0–100 }
        action: { type: string, enum: [Accept, Review, New], description: "Recommended action: Accept (auto-accept band), Review (queued, candidate shown), New (queued as a potential new LP)" }
        band:   { type: string, enum: [AUTO_ACCEPT, REVIEW_HIGH, REVIEW_LOW, NO_MATCH], description: Confidence band the combined score falls into (§6.4) }

    MatchTestResult:
      type: object
      description: Result of POST /matching/test
      properties:
        input:      { type: string, description: Original input name }
        normalised: { type: string, description: Name after normalisation (suffix removal, abbreviation expansion) }
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'

    MatchQueueItem:
      type: object
      properties:
        id:            { type: integer }
        submissionId:  { type: integer }
        facilityId:    { type: integer }
        facilityName:  { type: string, description: Facility name resolved for display }
        agentName:     { type: string, description: Extracted investor name from the document }
        masterName:    { type: string, nullable: true, description: Best-matched LP Master name, or masterNameOverride if set }
        score:         { type: integer, description: Combined similarity score 0–100 }
        decision:      { type: string, enum: [Pending, Accepted, Rejected, Manual], description: Current decision (capitalised) }
        status:        { type: string, description: Mirrors decision for UI display }
        isNew:         { type: boolean, description: True if no existing LP Master record matched }
        reasons:       { type: array, items: { type: string }, description: Reasons explaining the queue action (low match score, low extraction confidence, etc.) }
        matchDetails:  { $ref: '#/components/schemas/MatchAnalysis' }

    LpRate:
      type: object
      description: One LP's most-recent advance rate and concentration limit as of a requested period.
      properties:
        lpId:            { type: integer }
        lpName:          { type: string, description: Investor name resolved for display }
        classification:  { type: string, description: LP classification at the time the rate was assigned }
        ubsAdvRatePct:   { type: number, description: UBS advance rate as a decimal fraction e.g. 0.9 = 90% }
        ubsConcLimitPct: { type: number, description: Per-LP concentration limit as a decimal fraction e.g. 0.075 = 7.5% }
        effectiveDate:   { type: string, format: date, description: ISO date (YYYY-MM-DD) the rate took effect }

    ScoredCandidate:
      type: object
      description: One scored LP Master candidate with its per-metric breakdown (§6.5)
      properties:
        name:     { type: string,  description: LP Master candidate name }
        jw:       { type: integer, description: Jaro-Winkler similarity 0–100 }
        lev:      { type: integer, description: Normalised Levenshtein similarity 0–100 }
        combined: { type: integer, description: Weighted combined score 0–100 }
        band:     { type: string,  enum: [AUTO_ACCEPT, REVIEW_HIGH, REVIEW_LOW, NO_MATCH] }

    MatchAnalysis:
      type: object
      description: Persisted match_details payload driving the Match Analysis panel (§6.5)
      properties:
        agentName:  { type: string, description: Original extracted agent name }
        normalized: { type: string, description: Agent name after the normalisation pipeline }
        band:       { type: string, enum: [AUTO_ACCEPT, REVIEW_HIGH, REVIEW_LOW, NO_MATCH], description: Winning candidate's confidence band }
        candidates:
          type: array
          description: Ranked top-5 LP Master candidates, highest combined score first
          items: { $ref: '#/components/schemas/ScoredCandidate' }

    MatchThresholds:
      type: object
      description: >
        Four-band confidence thresholds (§6.4). autoAccept ≥ band is committed automatically;
        reviewQueue..autoAccept-1 is high-confidence review; noMatch..reviewQueue-1 is low-confidence
        review; below noMatch is queued as a potential new LP. Nothing is auto-rejected.
      properties:
        autoAccept:  { type: number, description: Score at or above which matches are auto-accepted, example: 95 }
        reviewQueue: { type: number, description: Score at or above which matches enter high-confidence review, example: 80 }
        noMatch:     { type: number, description: Score below which a row is queued as a potential new LP, example: 50 }

    # ── Config ─────────────────────────────────────────────────────────────────

    ClassificationConfig:
      type: object
      properties:
        clsOptions:    { type: array, items: { type: string } }
        regionOptions: { type: array, items: { type: string } }
        typeOptions:   { type: array, items: { type: string } }
        spRatingOptions:  { type: array, items: { type: string } }
        mdyRatingOptions: { type: array, items: { type: string } }
        busaRateMap:   { type: object, additionalProperties: { type: string }, description: Classification → BUSA rate string e.g. "90%" }
        agentRateMap:  { type: object, additionalProperties: { type: string } }
        clsTagMap:     { type: object, additionalProperties: { type: string } }
        clsCriteria:   { type: object, additionalProperties: { type: string } }

    EligibilityTier:
      type: object
      properties:
        cls:  { type: string }
        rate: { type: string }

    EligibilityRule:
      type: object
      properties:
        id:     { type: string }
        rule:   { type: string }
        value:  { type: string }
        active: { type: boolean }

    EligibilityConfig:
      type: object
      description: >
        Response keys are SCREAMING_SNAKE_CASE matching the DB config key names.
        Only keys present in the database are included in the response.
      properties:
        BUSA_TIERS:       { type: array, items: { $ref: '#/components/schemas/EligibilityTier' } }
        AGENT_TIERS:      { type: array, items: { $ref: '#/components/schemas/EligibilityTier' } }
        CONC_LIMITS:      { type: array, items: { type: object, additionalProperties: true } }
        CLS_CONC_LIMIT_DEFAULTS:
          type: object
          additionalProperties: { type: number }
          description: >
            Per-LP default concentration limit (percent of total uncalled capital) keyed by
            LP classification label (both taxonomies). Seeded to the UPPER bound of each
            class range from Concentration_Limits.xls; Excluded is a hard 0. Superseded for
            the BB engine by BB_CRITERIA_MATRIX — now consumed only by the LP Master record
            entry form (default seed + range check).
        CLS_CONC_LIMIT_BOUNDS:
          type: object
          additionalProperties:
            type: object
            properties:
              min: { type: number }
              max: { type: number }
          description: >
            Accepted concentration-limit range (min/max percent) per LP classification,
            from the same source workbook. Consumed by the LP record entry form to warn —
            without blocking — when an analyst enters a limit outside the class norm.
        BB_CRITERIA_MATRIX: { $ref: '#/components/schemas/BbCriteriaMatrix' }
        GLOBAL_SETTINGS:  { type: array, items: { type: object, additionalProperties: true } }

    BbCriteriaMatrix:
      type: object
      description: >
        Borrowing Base Criteria matrix (Concentration_Limits.xlsx tabs 2-3, `bb_criteria_matrix`
        config key). Authoritative source of the Run Shadow BB advance-rate and per-LP
        concentration-limit suggestions. Advance rate splits on the LP's funded % (called ÷
        commitment) at `fundedThresholdPct`; concentration limit is funded-independent. Rated
        Investors resolve a rating band via the tri-party "eligible rating" waterfall over
        S&P/Moody's/Fitch (three → middle/median, two → lower, one → as-is); sub-BBB- clamps to
        `subInvestmentGradeBand`. See pe-sub-docs/BB_CRITERIA_DESIGN.md.
      required: [fundedThresholdPct, rated, classes]
      properties:
        fundedThresholdPct:
          type: number
          example: 40
          description: Single funded-% break point; LPs at or above use the gte40 advance-rate column
        ratingBands:
          type: object
          description: Agency ratings that resolve to each band (AAA/AA/A/BBB), for Rated Investor CL/AR lookup
          additionalProperties:
            type: object
            properties:
              sp:     { type: array, items: { type: string } }
              moodys: { type: array, items: { type: string } }
              fitch:  { type: array, items: { type: string } }
        ratingBandSelection: { type: string, example: middle }
        ratingBandTieBreak:
          type: object
          properties:
            three: { type: string, example: middle }
            two:   { type: string, example: lower }
            one:   { type: string, example: asIs }
        subInvestmentGradeBand:
          type: string
          example: BBB
          description: Band a rated LP clamps to when its rating matches no configured band
        rated:
          type: array
          description: Rated Investor rows, resolved by rating band
          items: { $ref: '#/components/schemas/BbCriteriaRatedBand' }
        classes:
          type: array
          description: Non-rated classes, resolved by UBS LP classification label
          items: { $ref: '#/components/schemas/BbCriteriaClass' }

    BbCriteriaAdvanceRate:
      type: object
      description: Advance rate (percent) either side of the funded-% break point
      properties:
        lt40:  { type: number, example: 65, description: Advance rate % when funded < fundedThresholdPct }
        gte40: { type: number, example: 90, description: Advance rate % when funded ≥ fundedThresholdPct }

    BbCriteriaRatedBand:
      type: object
      properties:
        band:          { type: string, example: AA }
        label:         { type: string, example: 'AA+ / Aa1 to AA- / Aa3', description: Verbatim agency rating range from the workbook }
        concLimitPct:  { type: number, example: 20 }
        advanceRatePct: { $ref: '#/components/schemas/BbCriteriaAdvanceRate' }

    BbCriteriaClass:
      type: object
      properties:
        cls:           { type: string, example: Other Institutional }
        category:      { type: string, example: Designated, description: LP Category rollup bucket (Rated / Unrated / Designated / Excluded) }
        concLimitPct:  { type: number, example: 5 }
        advanceRatePct: { $ref: '#/components/schemas/BbCriteriaAdvanceRate' }

    CalcMode:
      type: object
      properties:
        id:          { type: string }
        title:       { type: string }
        desc:        { type: string }
        recommended: { type: boolean }

    WizardConfig:
      type: object
      properties:
        wizardSteps:     { type: array, items: { type: string } }
        snapshotOptions: { type: array, items: { type: string } }
        calcModes:       { type: array, items: { $ref: '#/components/schemas/CalcMode' } }

    AuditConfig:
      type: object
      properties:
        eventTypes:          { type: array, items: { type: string } }
        eventTypeVariant:    { type: object, additionalProperties: { type: string } }
        auditRetentionLabel: { type: string, example: 7 years }
        defaultDateFrom:     { type: string, format: date }
        defaultDateTo:       { type: string, format: date }

    MatchingConfig:
      type: object
      properties:
        defaultThresholds: { $ref: '#/components/schemas/MatchThresholds' }
        legalSuffixes:     { type: array, items: { type: string } }
        knownAbbreviations: { type: array, items: { type: string } }
        abbrevRegexMap:    { type: object, additionalProperties: { type: string } }

    ReportsConfig:
      type: object
      properties:
        reportTabs:          { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string } } } }
        bbCertOptions:       { type: object, additionalProperties: { type: array, items: { type: string } } }
        certRows:            { type: array, items: { type: object, additionalProperties: true } }
        classRows:           { type: array, items: { type: object, additionalProperties: true } }
        reportHistory:       { type: array, items: { type: object, additionalProperties: true } }
        reportSchedules:     { type: array, items: { type: object, additionalProperties: true } }
        concentrationTests:  { type: array, items: { type: string } }

    # ── Audit ──────────────────────────────────────────────────────────────────

    AuditEvent:
      type: string
      enum:
        - BB Recalculated
        - LP Reclassified
        - LP Data Updated
        - Upload
        - Export
        - Config Change
        - Match Config Change
        - Login
        - Field Mapping Change
        - Abort
        - Re-extraction
        - Extraction Confirmed
      description: Controlled vocabulary of audit event types

    AuditRow:
      type: object
      description: >
        Single row returned by GET /audit. Fields are denormalized for UI
        rendering — facility name is resolved from facility_id, user comes
        from user_name stored at write time.
      required: [ts, event, detail, facility, user, ip]
      properties:
        ts:
          type: string
          format: date-time
          description: Event timestamp (yyyy-MM-dd'T'HH:mm:ss)
          example: '2026-05-31T14:15:00'
        event:
          $ref: '#/components/schemas/AuditEvent'
        detail:
          type: string
          description: >
            Human-readable event detail. Format varies by event type:
            BB Recalculated — "N LPs · UBS BB $X.XM";
            LP Reclassified — "LP Name → NewCls (was OldCls)";
            LP Data Updated — "N LP records updated from FORMAT extraction";
            Upload — "periodMonth · fileName · agentBank";
            Login — "User login";
            Abort — "Submission #N aborted";
            Re-extraction — "Submission #N re-extracted";
            Extraction Confirmed — "Submission #N extraction confirmed";
            Field Mapping Change — "FM Alias Added/Removed/Updated: ...";
            Config Change / Match Config Change — "<section label> updated"
          example: '1,492 LPs · UBS BB $183.9M'
        facility:
          type: string
          description: Denormalized facility name; "—" when event is not facility-scoped
          example: 'KKR North America Fund XIV'
        user:
          type: string
          description: Display name of the actor; empty string until auth is integrated
          example: 'J. Smith'
        ip:
          type: string
          description: Client IP — from X-Forwarded-For header if present, else remoteAddr
          example: '10.0.1.44'

    # ── Extraction Ingest ──────────────────────────────────────────────────────

    StringFieldValue:
      type: object
      description: A string field extracted from the spreadsheet with a confidence score
      properties:
        value:        { type: string, nullable: true }
        confidence:   { type: number, minimum: 0, maximum: 1, description: Header-match confidence 0–1 }
        sourceHeader: { type: string, nullable: true, description: Original column header text }

    DecimalFieldValue:
      type: object
      description: A numeric field extracted from the spreadsheet with a confidence score
      properties:
        value:        { type: number, nullable: true, description: Parsed numeric value (rates stored as decimals e.g. 0.65 for 65%) }
        confidence:   { type: number, minimum: 0, maximum: 1 }
        sourceHeader: { type: string, nullable: true }

    ExtractionWarningEntry:
      type: object
      properties:
        field:    { type: string, description: Canonical field name e.g. "commitment" }
        message:  { type: string, description: Warning description }
        rowIndex: { type: integer }

    ExtractedLpRow:
      type: object
      description: Single LP row as extracted by pe-sub-extraction
      properties:
        rowIndex:           { type: integer, description: Zero-based row index in the source spreadsheet }
        investorName:       { $ref: '#/components/schemas/StringFieldValue' }
        commitment:         { $ref: '#/components/schemas/DecimalFieldValue' }
        uncalled:           { $ref: '#/components/schemas/DecimalFieldValue' }
        aum:                { $ref: '#/components/schemas/DecimalFieldValue' }
        agentRate:          { $ref: '#/components/schemas/DecimalFieldValue' }
        concentrationLimit: { $ref: '#/components/schemas/DecimalFieldValue' }
        agentCls:           { $ref: '#/components/schemas/StringFieldValue' }
        agentClsSource:
          allOf:
            - $ref: '#/components/schemas/StringFieldValue'
          description: Set to EXTRACTED when the agent classification came from the source file
        requiresReview:
          type: boolean
          description: True when any field has confidence < 0.7 or a missing value
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionWarningEntry'

    IngestRequest:
      type: object
      required: [facilityId, extraction]
      properties:
        facilityId: { type: integer }
        extraction:
          type: object
          required: [records]
          properties:
            template:
              type: object
              properties:
                format:
                  type: string
                  description: >
                    Detected bank template format (mirrors `TemplateFormat.java` in
                    pe-sub-extraction). Active agent banks first, then legacy / inactive
                    (`GOLDMAN_SACHS` is the prior agent for Blue Owl GP Stakes V, now Wells Fargo),
                    then utility values.
                  enum:
                    - BANK_OF_AMERICA
                    - BMO
                    - BNY_MELLON
                    - CIBC
                    - CITY_NATIONAL
                    - CITIBANK
                    - JPM
                    - LLOYDS
                    - MIZUHO
                    - MORGAN_STANLEY
                    - MT_BANK
                    - NATIXIS
                    - PNC_BANK
                    - SILICON_VALLEY_BANK
                    - SMBC
                    - SOCIETE_GENERALE
                    - UBS_BANK_USA
                    - WELLS_FARGO
                    - GOLDMAN_SACHS
                    - BARCLAYS
                    - FIFTH_THIRD
                    - HUNTINGTON
                    - WHITE_OAK
                    - ARES
                    - MIDCAP_FINANCIAL
                    - CITIZENS_FINANCIAL
                    - INTERNAL
                    - UNKNOWN
                version:        { type: string, nullable: true }
                headerRowIndex: { type: integer }
            records:
              type: array
              items:
                $ref: '#/components/schemas/ExtractedLpRow'
            totalFlagged: { type: integer }

    IngestRecordResult:
      type: object
      properties:
        rowIndex:      { type: integer }
        extractedName: { type: string, nullable: true }
        matchedLpId:   { type: integer, nullable: true }
        matchedLpName: { type: string, nullable: true }
        matchScore:    { type: integer, nullable: true, description: Combined similarity score 0–100 }
        action:
          type: string
          enum: [Updated, Queued, Skipped]
          description: >
            Updated — LP fields written;
            Queued — needs credit officer review;
            Skipped — no match or no investor name
        updatedFields:
          type: array
          items: { type: string }
          description: LP field names written (e.g. ["aum", "capCommit", "uc"])
        warnings:
          type: array
          items: { type: string }
          description: Reasons for Queued or Skipped actions

    IngestResult:
      type: object
      properties:
        facilityId:     { type: integer }
        processedAt:    { type: string, format: date-time }
        templateFormat: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/IngestRecordResult'
        updated: { type: integer, description: Number of LP records successfully updated }
        queued:  { type: integer, description: Number of rows placed in the review queue }
        skipped: { type: integer, description: Number of rows that could not be matched }

    # ── Errors ─────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }
